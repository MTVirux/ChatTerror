name: Create Test Release

on:
  push:
    tags:
      - testing_*

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DALAMUD_HOME: ${{ github.workspace }}/dalamud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate ref
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ($env:REF_NAME -notmatch '^testing_[0-9A-Za-z._-]+$') {
            Write-Error "Tag '$($env:REF_NAME)' contains unexpected characters."
            exit 1
          }
          if ($env:COMMIT_SHA -notmatch '^[0-9a-f]{40}$') {
            Write-Error "Commit sha '$($env:COMMIT_SHA)' is not a 40-character hash."
            exit 1
          }
          "TAG=$($env:REF_NAME)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VER=$($env:REF_NAME -replace '^testing_','')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SHA=$($env:COMMIT_SHA)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore ChatTerror.sln --locked-mode
      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip $env:DALAMUD_HOME
      - name: Build
        run: |
          $ver = $env:VER
          dotnet build src/ChatTerror.Plugin --no-restore --configuration Debug --nologo -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver
      - name: Verify repo.json matches tag
        run: |
          $expected = $env:VER
          $repo = (Get-Content -Raw './repo.json' | ConvertFrom-Json)[0]
          if ($repo.TestingAssemblyVersion -ne $expected) {
            Write-Error "repo.json TestingAssemblyVersion ($($repo.TestingAssemblyVersion)) does not match tag ($expected). Did testing.ps1 fail to commit?"
            exit 1
          }
      - name: Generate bin manifest from repo.json
        run: |
          $ver = $env:VER
          $repo = Get-Content -Raw './repo.json' | ConvertFrom-Json
          $repo[0].AssemblyVersion = $ver
          $repo[0] | ConvertTo-Json -Depth 10 | Set-Content './src/ChatTerror.Plugin/bin/Debug/ChatTerror.json'
      - name: Archive
        run: Compress-Archive -Path src/ChatTerror.Plugin/bin/Debug/* -DestinationPath ChatTerror.zip
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: |
            ./src/ChatTerror.Plugin/bin/Debug/*
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:TAG" "./ChatTerror.zip" --title "ChatTerror $env:TAG"

      - name: Write out repo.json
        run: |
          $verT = $env:TAG
          $ver = $env:VER
          $path = './repo.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json[0].TestingAssemblyVersion = $ver
          $json[0].LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          $json[0].DownloadLinkTesting = $json.DownloadLinkTesting -replace '[^/]+/ChatTerror.zip',"$verT/ChatTerror.zip"
          $content = $json | ConvertTo-Json -AsArray
          set-content -Path $path -Value $content

      - name: Commit repo.json
        run: |
          git config --global user.name "Actions User"
          git config --global user.email "actions@github.com"
          git fetch origin master
          git branch -f master $env:SHA
          git checkout master
          git add repo.json
          git commit -m "[CI] Updating repo.json for $env:TAG" || true
          git push origin master
