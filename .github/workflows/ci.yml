name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      DALAMUD_HOME: ${{ github.workspace }}/dalamud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          curl -fsSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q dalamud.zip -d "$DALAMUD_HOME"

      - run: dotnet restore ChatTerror.sln --locked-mode
      - run: dotnet test ChatTerror.sln --no-restore

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
